        <h1>Dashboard</h1>
        <div id="map"></div>

        <button type="button" id="sendTrajectoryButton">send trajectory</button>
        <button type="button" id="clearTrajectoryButton">clear trajectory</button>
</body>

<script>
        var trajectory = [];

        function clearTrajectory() {
                trajectory = [];
        }

        document.querySelector("#clearTrajectoryButton").addEventListener("click", () => {
                clearTrajectory();
                console.log("trajectory cleared");
        })
        document.querySelector("#sendTrajectoryButton").addEventListener("click", () => {
                fetch("/trajectory", {
                        method: "POST",
                        body: JSON.stringify(trajectory)
                }).then((res) => {
                        if (!res.ok) {
                                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                        }

                        console.log("trajectory sent successfully");
                        clearTrajectory();

                }).catch((err) => {
                        console.log(`failed to send trajectory: ${err.message}`);
                })
        })

        // show map
        var map = L.map('map');
        map.setView([51.505, -0.09], 13);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        var marker = L.marker([51.5, -0.09]).addTo(map);
        var popup = L.popup();
        function onMapClick(e) {
                popup
                        .setLatLng(e.latlng)
                        .setContent("You clicked the map at " + e.latlng.toString())
                        .openOn(map);
                trajectory.push(e.latlng);
                console.log(trajectory);
        }
        map.on("click", onMapClick);
